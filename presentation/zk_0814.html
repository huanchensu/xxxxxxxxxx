【被問到量子怎麼答】愛因斯坦這場爭論科學上是輸的:Bell 不等式的實驗檢驗(Aspect / Clauser / Zeilinger,2022 諾貝爾物理獎)排除了局域隱變數,主流共識認為量子隨機是本質的,不是隱藏參數。正確說法是「是否存在真隨機仍有爭議,但那跟我們無關」— 就算真隨機存在,你的程式拿到的仍然是決定性演算法的輸出。這個回應反而強化今天的主題,不用迴避。

骰子屬於中間那段:混沌不是隨機,只是我們算不動。(~3分鐘)">
  <div class="kicker"><span class="pip"></span>Part 1 · true randomness</div>
  <h2 class="title">Does anything actually roll dice?</h2>
  <div class="body split2">
    <div class="card" style="display:flex;flex-direction:column;justify-content:center">
      <span class="pip"></span>
      <div class="quote">&ldquo;God does not<br>play dice.&rdquo;</div>
      <hr class="hair" style="width:120px;margin:22px 0 0">
      <div class="attr">Albert Einstein, letter to Max Born, 1926</div>
      <p class="muted" style="font-size:13px;margin-top:12px">His position: apparent randomness is a confession of ignorance, not a property of the world.</p>
    </div>
    <div class="stack" style="justify-content:center">
      <div class="qrow"><h4>Laplace's demon, 1814</h4>
        <p>Know every particle's position and momentum, and both past and future follow by calculation. On this view randomness is not a thing — it's a gap in the observer.</p></div>
      <div class="qrow"><h4>Chaos, not chance</h4>
        <p>Dice, weather, a double pendulum: plain deterministic equations whose outcome flips on the tenth decimal place. Unpredictable is not the same as random.</p></div>
      <div class="qrow"><h4>What that leaves us</h4>
        <p>Every source a computer can reach is a physical process too messy to model. Not randomness in principle — randomness in practice.</p></div>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>For an engineer the question isn't whether the universe rolls dice — <span class="hl">it's whether your adversary can compute the roll.</span></p>

</section>

<section class="slide" data-notes="合併頁,節奏要快。常見誤區:以為 CSPRNG「比較隨機」— 不是,兩者都是決定性的,差在可預測性的計算難度。
Mersenne Twister 624 個輸出可還原內部狀態是很好的具體數字。
可現場開 jshell 跑右邊那段給大家看。(~3分鐘)">
  <div class="kicker"><span class="pip"></span>Part 1 · randomness in computers</div>
  <h2 class="title">Computers are deterministic — a PRNG just unfolds a seed</h2>
  <div class="body split2">
    <div class="stack" style="gap:16px">
      <div class="card">
        <h4>PRNG — goal: statistical uniformity</h4>
        <p><code>java.util.Random</code> is a linear congruential generator: next = (a·seed + c) mod m. Mersenne Twister has better statistics, but 624 outputs fully recover its internal state. Fine for simulation, games, sampling.</p>
      </div>
      <div class="card alt">
        <h4>CSPRNG — goal: unpredictability</h4>
        <p><code>SecureRandom</code>, <code>/dev/urandom</code>: built from hashes and block ciphers. No amount of output lets you compute the next one. For keys, session tokens, nonces.</p>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;justify-content:center">
      <pre class="code"><span class="c">$ same seed, run twice</span>

new Random(42).nextDouble()

<span class="a">→ 0.7275  0.6832  0.3138 ...</span></pre>

<!-- S13 Where the probability lives -->
<section class="slide" data-notes="這頁是補上第二部和第四部之間的斷層。多數人聽完洞穴會有一個沒說出口的疑問:買酒那個證明看起來只是驗簽章,骰子到底在哪?

三個講法依序:
1. 先破框架 —「用機率證明你是對的」是錯的說法。誠實者過關機率是 100%,他不需要運氣。機率只作用在說謊的人身上。驗證者的推理是反證法加一個機率逃生口:如果你在說謊,你必須連中 30 次;你過了;所以要嘛你誠實,要嘛你中了十億分之一。
2. 順序就是全部。承諾在前、挑戰在後,說謊者在還沒看到題目時就必須押寶。順序顛倒的話作弊者 100% 過關 — 這也是第三部 PS3 事故的同一個道理。
3. SNARK 看起來沒擲骰子,是因為它擲的是一顆 2^256 面的骰子,擲一次就夠。把「這段計算做對了」變成多項式恆等式,兩個不同的 d 次多項式最多在 d 個點相同,隨機取一點就抓得到。d≈2^20、|F|≈2^256,被騙機率 2^-236。

順帶點破:這也解釋了為什麼驗證那麼便宜 — 驗證者不是重算一遍,是抽查一個點。機率買到的就是這個捷徑。

最後分清楚:機率負責 soundness;zero-knowledge 靠的是 blinding 和模擬器論證,跟機率無關。兩件事不要混。(~3分鐘)">

  <h2 class="title">Where the probability actually lives</h2>
  <p class="lead">It never proves you are right. It makes lying survivable <i>only by luck</i> — so the verifier reasons backwards: <b>“If you were lying you'd have had to survive 30 coin flips. You did. So either you're honest, or you just got one-in-a-billion lucky.”</b></p>

      <h4>The honest prover rolls nothing</h4>

    <div class="card">
      <h4>Commit first, challenge second</h4>
      <hr class="hair">
      <p style="margin-bottom:14px">The order is the whole trick — a liar must place their bet before seeing the question, and can only answer a fraction of the questions.</p>

<!-- S14 Four stages -->
<section class="slide" data-notes="這頁把上一頁的「順序就是全部」放大成具體的四個階段。用雲霄飛車軌道 + 保險箱的比喻講最好懂:

1. 建造軌道 — 證明者拿自己手上的正確解答,透過算術化(arithmetization)把問題和秘密編碼成一個巨大的多項式。這一步在他自己電腦裡默默完成,沒有人看著。

2. 鎖進保險箱 — 多項式太大不能整包傳,傳了也會洩密。所以證明者對它生成一個極小的承諾(commitment),幾十個 bytes,交給驗證者。喀嚓一聲,軌道形狀被鎖死,事後絕對改不了。

3. 擲骰子 — 驗證者拿到鎖死的保險箱之後,才啟動隨機數,從 2^256 大的體裡挑一個座標 z。台詞就是:「你現在不能改答案了,請告訴我你的軌道在 z 的高度是多少?」

4. 開箱檢查 — 證明者把 z 代入多項式算出值,連同 opening proof 一起交出。驗證者用手上的承諾快速核對:這個高度是不是真的來自原本鎖在裡面的那條軌道。

要強調的點:紅色虛線那條「不可回頭線」就是全部的防線。如果證明者能在看到 z 之後才蓋軌道,他隨便都能蓋一條剛好通過那個點的 — 作弊 100% 成功。所以 commit 必須嚴格早於 challenge。

這也回頭解釋了 Fiat-Shamir 為什麼安全:c = Hash(public ∥ commitment),commitment 已經在 hash 的輸入裡,想換一個對自己有利的 z 就得換 commitment,換了 commitment 又得重算 hash — 等於暴力搜尋。(~3分鐘)">

    <div class="steps4" style="flex:1">
      <div class="card">
        <div class="n">1</div>
        <h4>Build the track</h4>
        <p>Arithmetization: the statement and the secret witness are encoded into one enormous polynomial. This happens privately, on the prover's own machine, with nobody watching.</p>
      </div>
      <div class="card">
        <div class="n">2</div>
        <h4>Lock the box</h4>
        <p>The polynomial is far too big to send — and sending it would leak the secret. Instead the prover sends a tiny <b>commitment</b>: a few dozen bytes that pin the shape down without revealing it.</p>
      </div>
      <div class="card alt">
        <div class="n">3</div>
        <h4>Roll the die</h4>
        <p>Only now does the verifier draw <code>z</code> at random from a field of ~2²⁵⁶ elements. "You can't change your answer any more. How high is your track at <code>z</code>?"</p>
      </div>
      <div class="card">
        <div class="n">4</div>
        <h4>Open and check</h4>
        <p>The prover returns <code>P(z)</code> plus an opening proof. The verifier checks that this value genuinely came from the polynomial sealed inside the commitment it already holds.</p>
      </div>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>A prover may build any track they like. <span class="hl">What they cannot do is rebuild it after the dice have landed.</span></p>
  </div>
</section>

<!-- S15 Divider 3 -->
<section class="slide divider" data-notes="轉場:把第一部(隨機)和第二部(證明)縫起來 — 這段是多數簡報會漏掉的。(30秒)">

  <h2>Randomness Is the Protocol's Lifeline</h2>
  <p>Every bit of soundness rests on one assumption: the challenge cannot be predicted.</p>
</section>

<!-- S16 Predictable challenge -->
<section class="slide" data-notes="PS3 事故技術上是簽章的 nonce、不是 ZKP 的挑戰,但失效機制同構:該隨機的地方不隨機,安全保證即刻歸零。ECDSA 與 Schnorr 類協議本來就是 sigma protocol 的親戚。
可補一句:Debian OpenSSL 2008 熵災難是另一個例子。(~3分鐘)">
  <div class="kicker"><span class="pip"></span>Part 3 · the role of randomness</div>
  <h2 class="title">A predictable challenge makes the proof worthless</h2>
  <div class="body split2">
    <div class="card">
      <h4>Why must challenges be random?</h4>
      <hr class="hair">
      <ul class="dots">
        <li>Recall the cave: a cheater who can guess your A/B call just walks that path first — and passes every round.</li>
        <li>So the 2⁻ⁿ soundness bound depends entirely on challenge unpredictability.</li>
        <li>If the verifier uses a weak PRNG — recoverable, predictable — any number of rounds is a placebo.</li>
      </ul>
    </div>
    <div class="card alt">
      <h4>Real-world failure: PS3 (2010)</h4>
      <hr class="hair">
      <ul class="dots">
        <li>Sony's ECDSA signatures reused a fixed value for the nonce k — which must be fresh randomness every time.</li>
        <li>Two signatures, one k → two equations → solve → the private key falls out.</li>
        <li>fail0verflow demoed it at CCC; homebrew signing was open forever after.</li>
      </ul>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>Crypto protocols rarely fail on the math — <span class="hl">they fail on the random numbers.</span></p>
  </div>
</section>

<!-- S17 Fiat-Shamir -->
<section class="slide" data-notes="關鍵直覺:hash 輸出無法在選定 commit 前被操控 — 想挑一個對自己有利的 c,只能不斷換 commit 重算,等於暴力搜尋。
呼應第一部:「隨機」的工程定義是不可預測,而 hash 的輸出對算不出 preimage 的人來說就是不可預測。random oracle model 一句帶過即可。
講完可以說:「記住『不需要對方在場』這件事,下一段整段都靠它。」(~3分鐘)">
  <div class="kicker"><span class="pip"></span>Part 3 · the role of randomness</div>
  <h2 class="title">Fiat–Shamir: a hash impersonating an unpredictable verifier</h2>
  <p class="lead">Problem: interaction takes many round-trips — and often there's nobody to interact with. How do we turn an interactive proof into a static one?</p>
  <div class="body split2">
    <div class="card">
      <h3>Interactive</h3>
      <hr class="hair">
      <p style="font-size:14.5px;color:var(--ink2)">1. &nbsp;Prover sends a commitment</p>
      <p style="font-size:14.5px;color:var(--accent);font-weight:700">2. &nbsp;Verifier "flips coins" → challenge c</p>
      <p style="font-size:14.5px;color:var(--ink2)">3. &nbsp;Prover answers with a response</p>
      <p class="muted" style="margin-top:22px;font-size:12.5px">Challenge from a live verifier + real randomness</p>
    </div>
    <div class="card alt">
      <h3>Non-interactive (Fiat–Shamir)</h3>
      <hr class="hair">
      <p class="mono" style="color:var(--accent);font-weight:700;font-size:16px">c = Hash(public ∥ commitment)</p>
      <p>The challenge comes from a hash — before committing, nobody can steer what c will be.</p>
      <p>The prover talks to itself and outputs one blob that anyone can verify later.</p>
      <p style="margin-top:12px;font-size:12.5px" class="muted">In a SNARK this same hash also fixes <i>where</i> the polynomial identity gets sampled — the die from slides 13–14, thrown by a function instead of a person. The commitment is inside the hash input, so steering z means redoing the commitment — and the hash with it.</p>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>A deterministic function simulating unpredictable randomness — <span class="hl">the answer to "what is probability inside a computer?"</span></p>
  </div>
</section>

<!-- S21 Four costs -->
<section class="slide" data-notes="四點裡第 3、4 點最少人想到,各多花一句。
第 2 點可以拉自己的經驗:一個 stored procedure 或 connection pool 出問題可以卡死整條交易鏈 — 現在把這個依賴放大到全國年齡驗證,SLA 壓力等級完全不同。
第 4 點是最根本的信任問題:中心化模式下 subject 只能「相信」issuer 誠實;ZK 模式下 issuer 只能在發證那一刻決定簽或不簽,之後沒有插手空間。(~3分鐘)">
  <div class="kicker"><span class="pip"></span>Part 4 · the objection</div>
  <h2 class="title">Four costs, none of them about the answer's size</h2>
  <div class="body cards4" style="gap:16px">
    <div class="card" style="padding:18px 20px">
      <h4>1 &nbsp;The log becomes a new surveillance database</h4>
      <p style="font-size:12.5px">You didn't design this dataset; it emerged. A behavioural trail — who, where, when — is strictly more sensitive than the birth-date field you were protecting. Retention, access control, subpoena exposure: all yours to own now.</p>
    </div>
    <div class="card" style="padding:18px 20px">
      <h4>2 &nbsp;The issuer is a runtime SPOF</h4>
      <p style="font-size:12.5px">Outage, DDoS, maintenance window, region failure → every bar, convenience store and online platform in the country stops verifying at the same moment. You've seen one connection pool stall a whole transaction chain; this is that blast radius, nationwide. And nothing works offline.</p>
    </div>
    <div class="card" style="padding:18px 20px">
      <h4>3 &nbsp;The verifier keeps a reusable identifier</h4>
      <p style="font-size:12.5px">To ask the question it must hand over <code>subject_id</code> — a high-value key into every system that indexes on national ID. A compromised or dishonest verifier stores it and replays it elsewhere, and the issuer cannot police what happens after it answers.</p>
    </div>
    <div class="card alt" style="padding:18px 20px">
      <h4>4 &nbsp;The issuer can lie selectively, unaccountably</h4>
      <p style="font-size:12.5px">You can only trust it answered honestly. If it is pressured, compromised, or simply targets someone, it returns <code>false</code> — and the subject cannot prove otherwise, because the judgement happened inside a box they can't see.</p>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>The bit isn't the leak. <span class="hl">The asking is.</span></p>
  </div>
</section>

<!-- S22 Two minimizations -->
<section class="slide" data-notes="這是整場的樞紐 — 前面三頁是舉證,這頁是結論。
最重要的是讓聽眾看見這是兩個獨立維度,不是同一件事的兩種程度。混為一談就會覺得 ZK 是過度工程。
一句話版本:如果只在乎回傳內容多小,中心化 API 已經夠了;ZK 存在的理由,是解決「查詢動作本身」帶來的問題。(~3分鐘)">
  <div class="kicker"><span class="pip"></span>Part 4 · the real distinction</div>
  <h2 class="title">Two minimizations, not one</h2>
  <div class="body split2">
    <div class="card">
      <h3>Content minimization</h3>
      <hr class="hair">
      <p style="font-size:14px">Don't let the verifier see your birthdate, name, address.</p>
      <div class="verdict">Centralized API: <span class="ok">solved ✓</span></div>
      <p style="font-size:13px">Returning <code>{result: true}</code> is genuinely enough.</p>
      <p class="muted" style="font-size:12.5px;margin-top:14px">ZK not required. This is the part the objection gets right.</p>
    </div>
    <div class="card alt">
      <h3>Query minimization</h3>
      <hr class="hair">
      <p style="font-size:14px">Don't let the issuer know who is checking whom. Don't require it online. Don't leave it room to lie selectively.</p>
      <div class="verdict">Centralized API: <span class="no">structurally impossible ✗</span></div>
      <p style="font-size:13px">The request <i>is</i> the leak — no response format fixes that.</p>
      <p class="muted" style="font-size:12.5px;margin-top:14px">This is what ZK is actually for.</p>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>The difference isn't how small the answer is. <span class="hl">It's whether you have to ask anyone at all.</span></p>
  </div>
</section>

<!-- S23 Stage 1 issuance -->
<section class="slide" data-notes="強調兩件事:(1) 簽的是 commitment 不是明文 — 這是後面能做 selective disclosure 的關鍵;(2) 這是一次性的,之後 issuer 完全退場。
blinding factor 的作用一句帶過:沒有 r 的話,生日只有幾萬種可能,commitment 直接被暴力枚舉。
對照 JWT:發證等於 issue 一張 token,只是 payload 藏在 commitment 裡,而且每次出示都重新隨機化,所以兩次出示無法被關聯 — 這是 JWT 的 jti / 簽章 bytes 做不到的。(~2分鐘)">
  <div class="kicker"><span class="pip"></span>Part 4 · how it actually works</div>
  <h2 class="title">Stage 1 — Issuance: the only time the issuer participates</h2>
  <div class="body split2" style="align-items:center">
    <div class="stack">
      <div class="qrow"><h4>1 &nbsp;Identify, once</h4>
        <p>You prove who you are at the registration office. The issuer confirms <code>birthdate = 2000-03-15</code>.</p></div>
      <div class="qrow"><h4>2 &nbsp;Commit</h4>
        <p><code>C = Commit(birthdate, r)</code> — where <code>r</code> is a random blinding factor.</p></div>
      <div class="qrow"><h4>3 &nbsp;Sign the commitment, not the plaintext</h4>
        <p><code>σ = Sign(issuer_sk, C)</code></p></div>
      <div class="qrow"><h4>4 &nbsp;Hand it over</h4>
        <p>The credential lands in your wallet. The issuer's job is done.</p></div>
    </div>
    <div>
      <pre class="code">credential = {
  birthdate:        2000-03-15,   <span class="c">← only you</span>
  blinding_factor:  r,            <span class="c">← only you</span>
  commitment:       C,
  issuer_signature: σ
}</pre>
      <p class="muted" style="font-size:12.5px;margin-top:16px;line-height:1.65">Same bones as a JWT — issuer-signed, client-held. Two differences: the payload hides inside the commitment, and every presentation is re-randomized, so two visits can't be linked.</p>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>From this moment the issuer <span class="hl">never learns when, where, or how often you use it.</span></p>
  </div>
</section>

            <li>The predicate holds: age ≥ 18</li>
            <li>The proof was generated just now, not replayed</li>
          </ul>
        </div>
        <div class="col">
          <h4>The bar never learns</h4>
          <ul class="n">
            <li>The actual date of birth</li>
            <li>Name, ID number, address</li>
            <li>Whether they're 19 or 70</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p>The heavy work sits with the person who has something to prove — <span class="hl">not with the institution, and not on the network.</span></p>
  </div>
</section>

<!-- S26 Three architectures -->
<section class="slide" data-notes="這頁是定位頁,主線已經講完,時間緊可抽。

  <div class="body" style="flex-direction:column">

      <thead><tr><th></th><th>Physical ID</th><th>Centralized API</th><th>ZK credential</th></tr></thead>

        <tr><td>Works offline</td><td class="y">✓</td><td class="n">✗</td><td class="y">✓</td></tr>

        <tr><td>Forgery resistance</td><td class="p">physical measures — holograms, laser engraving</td><td class="p">the database is authoritative</td><td class="p">cryptographic signatures</td></tr>
        <tr><td>Revocation / instant update</td><td class="n">✗ a cancelled card is still in your hand</td><td class="y">✓ instant</td><td class="p">needs extra machinery</td></tr>
        <tr><td>Works remotely / online</td><td class="n">✗ photos are forgeable</td><td class="y">✓</td><td class="y">✓</td></tr>

<!-- S27 Revocation -->
<section class="slide" data-notes="主動講缺點會讓工程師聽眾更相信前面所有內容。
最後那句是整場最誠實的一句:ZK 不能防止 issuer 一開始就簽發錯誤或惡意資料。有人問「ZK 到底保證什麼」時,這句就是答案。
一句話權衡:中心化用連線換即時性,ZK 用額外撤銷機制換隱私與離線。(~2分鐘)">
  <div class="kicker"><span class="pip"></span>Part 4 · the cost</div>
  <h2 class="title">Not a free lunch: revocation</h2>
  <p class="lead">A ZK proof, once generated, is mathematically true forever. But credentials get revoked — and maths doesn't know that.</p>
  <div class="body" style="flex-direction:column;gap:16px">
    <div class="cards3" style="flex:1">
      <div class="card"><h4>Revocation list</h4>
        <p>A Merkle tree or accumulator of revoked credentials; the proof additionally shows non-membership. Verifiers sync the root hash periodically — so "offline" really means "offline between syncs."</p></div>
      <div class="card"><h4>Short-lived credentials</h4>
        <p>Same idea as JWT expiry: the wallet re-fetches on a schedule. Simple, but partially reintroduces the online dependency you were trying to remove.</p></div>
      <div class="card"><h4>Periodic re-issuance</h4>
        <p>The issuer re-signs on a cycle; anything not refreshed expires by itself.</p></div>
    </div>
    <div class="card alt" style="padding:16px 22px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
        <p style="margin:0;font-size:13.5px"><b>Centralized</b> — revocation is instant; the price is a network round-trip on every single check.</p>
        <p style="margin:0;font-size:13.5px"><b>ZK</b> — revocation needs extra machinery; what you buy is query privacy and offline capability.</p>
      </div>
    </div>
  </div>
  <div class="takeaway"><span class="pip"></span>
    <p><span class="hl">And note what ZK does not prove: it proves the issuer signed this — not that what the issuer signed is true.</span> That layer of trust neither architecture escapes.</p>
  </div>
</section>

<script>
(function(){
  var tpl = document.getElementById('slides').content;
  var deck = document.getElementById('deck');
  deck.appendChild(document.importNode(tpl, true));
  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  // footers
  slides.forEach(function(s, idx){
    if (s.dataset.nofoot !== undefined) return;
    var f = document.createElement('div');
    f.className = 'foot';
    f.innerHTML = '<b>' + String(idx+1).padStart(2,'0') + '</b><span>Proving with Probability</span>';
    s.appendChild(f);
  });

  function scale(){
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w/1280, h/720) * 0.94;
    deck.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', scale); scale();

  function titleOf(s){
    if (s.dataset.title) return s.dataset.title;
    var t = s.querySelector('.title, h1, h2');
    return t ? t.textContent.trim().replace(/\s+/g,' ') : 'Slide';
  }

  var tocList = document.getElementById('tocList');
  slides.forEach(function(s, idx){
    var li = document.createElement('li');
    li.innerHTML = '<span class="i">' + String(idx+1).padStart(2,'0') + '</span><span class="t">' +
      titleOf(s) + '</span>';
    li.addEventListener('click', function(){ go(idx); toggleToc(false); });
    tocList.appendChild(li);
  });

  function render(){
    slides.forEach(function(s, idx){ s.classList.toggle('active', idx === i); });
    document.getElementById('count').textContent = (i+1) + ' / ' + total;
    document.getElementById('bar').style.width = ((i)/(total-1)*100) + '%';
    document.getElementById('notesBody').textContent = slides[i].dataset.notes || '(no notes)';
    Array.prototype.forEach.call(tocList.children, function(li, idx){
      li.classList.toggle('cur', idx === i);
    });
    if (location.hash !== '#/' + (i+1)) history.replaceState(null, '', '#/' + (i+1));
  }
  function go(n){ i = Math.max(0, Math.min(total-1, n)); render(); }
  function next(){ go(i+1); } function prev(){ go(i-1); }

  function toggleNotes(on){
    var el = document.getElementById('notes');
    el.classList.toggle('on', on === undefined ? !el.classList.contains('on') : on);
  }
  function toggleToc(on){
    var el = document.getElementById('toc');
    el.classList.toggle('on', on === undefined ? !el.classList.contains('on') : on);
  }

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter'){ e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
    else if (k === 'Home'){ go(0); }
    else if (k === 'End'){ go(total-1); }
    else if (k === 'n' || k === 'N'){ toggleNotes(); }
    else if (k === 'o' || k === 'O'){ toggleToc(); }
    else if (k === 'Escape'){ toggleToc(false); toggleNotes(false); }
    else if (k === 'f' || k === 'F'){
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
  });

  document.getElementById('btnNotes').addEventListener('click', function(){ toggleNotes(); });
  document.getElementById('btnToc').addEventListener('click', function(){ toggleToc(); });
  document.getElementById('toc').addEventListener('click', function(e){
    if (e.target.id === 'toc') toggleToc(false);
  });

  var sx = null;
  document.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 55){ dx < 0 ? next() : prev(); }
    sx = null;
  }, {passive:true});

  var m = location.hash.match(/^#\/(\d+)$/);
  go(m ? parseInt(m[1],10) - 1 : 0);
})();
</script>
